name: CI/CD Pipeline (Build Image, Push to Harbor, ArgoCD Deploy)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t 192.168.4.200:30002/library/demo-app:${{ github.sha }} ./app

      - name: Update Helm values.yaml
        run: |
          sed -i "s|repository: .*|repository: 192.168.4.200:30002/library/demo-app|g" helm-web-app/values.yaml
          sed -i "s|tag: .*|tag: \"${{ github.sha }}\"|g" helm-web-app/values.yaml
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add helm-web-app/values.yaml
          git commit -m "Auto-update image tag to ${{ github.sha }} [skip ci]" || echo "No changes"
          git push